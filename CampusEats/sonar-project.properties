# SonarQube Configuration for CampusEats
sonar.projectKey=CampusEatsProject_dotNET
sonar.organization=your-org-key

# Source directories (backend only)
sonar.sources=CampusEats/Features,CampusEats/Validators,CampusEats/Persistence

# Test directories
sonar.tests=CampusEats.Test

# Exclude Frontend entirely from analysis
sonar.exclusions=\
  **/CampusEats.Frontend/**,\
  **/Migrations/**,\
  **/obj/**,\
  **/bin/**,\
  **/Program.cs,\
  **/DependencyInjection.cs,\
  **/ServiceExtensions.cs,\
  **/EndpointMapper.cs

# Exclude Frontend and infrastructure from coverage
sonar.coverage.exclusions=\
  **/CampusEats.Frontend/**,\
  **/Migrations/**,\
  **/Program.cs,\
  **/DependencyInjection.cs,\
  **/ServiceExtensions.cs,\
  **/EndpointMapper.cs,\
  **/*Request.cs,\
  **/*Dto.cs,\
  **/*Model.cs

# Coverage report paths
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=**/TestResults/**/coverage.cobertura.xml
