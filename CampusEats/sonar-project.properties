# SonarQube Configuration for CampusEats

# Exclude from coverage analysis (not testable with unit tests)
sonar.coverage.exclusions=\
  **/Migrations/**/*.cs,\
  **/CampusEats.Frontend/**/*.cs,\
  **/CampusEats.Frontend/**/*.razor,\
  **/Program.cs,\
  **/DependencyInjection.cs,\
  **/ServiceExtensions.cs,\
  **/EndpointMapper.cs,\
  **/*Request.cs,\
  **/*Dto.cs,\
  **/*Model.cs

# Exclude from code analysis (generated code)
sonar.exclusions=\
  **/Migrations/**/*.cs,\
  **/obj/**,\
  **/bin/**

# Focus coverage on backend business logic only
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=**/coverage.xml
